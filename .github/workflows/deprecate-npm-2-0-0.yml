# One-shot: deprecate @trustflow 2.0.0 after the v2.0.1 tag publish.
#
# Uses the same repository secret as publish-npm.yml (NPM_TOKEN → NODE_AUTH_TOKEN).
# Do not commit tokens. This job only runs on this release branch.
name: Deprecate npm 2.0.0

on:
  push:
    branches:
      - cursor/deprecate-npm-2-0-0-9fa3

permissions:
  contents: read

jobs:
  deprecate:
    if: github.repository == 'etienne-source/agent-trust-sdk'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "GitHub secret NPM_TOKEN is required to deprecate @trustflow packages."
            exit 1
          fi

      - name: Deprecate 2.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm deprecate @trustflow/sdk@2.0.0 "Upgrade to @trustflow/sdk@2.0.1 (registry-down fail-closed)."
          npm deprecate @trustflow/cli@2.0.0 "Upgrade to @trustflow/cli@2.0.1 (registry-down fail-closed)."
          npm deprecate @trustflow/mcp-server@2.0.0 "Upgrade to @trustflow/mcp-server@2.0.1 (registry-down fail-closed)."
          npm deprecate @trustflow/next-plugin@2.0.0 "Upgrade to @trustflow/next-plugin@2.0.1 (registry-down fail-closed)."
          npm deprecate @trustflow/vercel-plugin@2.0.0 "Upgrade to @trustflow/vercel-plugin@2.0.1 (registry-down fail-closed)."
